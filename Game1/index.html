<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>탄막 슈팅</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d17; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  canvas { background: #0b0d17; box-shadow: 0 0 30px rgba(120,140,255,.25); max-height: 100vh; max-width: 100vw; }
</style>
</head>
<body>
<canvas id="game" width="480" height="720"></canvas>
<script>
"use strict";
// ===== 기본 설정 =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = W * scale + "px";
  canvas.style.height = H * scale + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

let highScore = 0;
try { highScore = Number(localStorage.getItem("game1_high")) || 0; } catch (e) {}

// ===== 입력 =====
const keys = {};
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if ((e.code === "Enter" || e.code === "Space") && state !== "play") startGame();
  if (e.code === "KeyP" && (state === "play" || state === "pause")) state = state === "play" ? "pause" : "play";
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// 터치/마우스: 드래그한 만큼 기체 이동
let pointer = null;
function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
canvas.addEventListener("pointerdown", e => {
  if (state !== "play") { startGame(); return; }
  pointer = toGame(e);
});
canvas.addEventListener("pointermove", e => {
  if (!pointer || state !== "play") return;
  const p = toGame(e);
  player.x = clamp(player.x + (p.x - pointer.x), 10, W - 10);
  player.y = clamp(player.y + (p.y - pointer.y), 10, H - 10);
  pointer = p;
});
window.addEventListener("pointerup", () => { pointer = null; });

// ===== 유틸 =====
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

// ===== 게임 상태 =====
let state = "title"; // title | play | pause | over
let player, shots, enemies, bullets, particles, items;
let score, lives, bombs, power, frame, wave, invuln, bossAlive, shake;

function startGame() {
  player = { x: W / 2, y: H - 80, r: 3, speed: 4.2, cooldown: 0 };
  shots = []; enemies = []; bullets = []; particles = []; items = [];
  score = 0; lives = 3; bombs = 2; power = 1; frame = 0; wave = 0;
  invuln = 120; bossAlive = false; shake = 0;
  state = "play";
}

// ===== 적 탄막 패턴 =====
function fire(x, y, angle, speed, color = "#ff6b9a", r = 5) {
  bullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r, color });
}
function aimAt(e) { return Math.atan2(player.y - e.y, player.x - e.x); }

const patterns = {
  aimed(e) { if (e.t % 50 === 0) fire(e.x, e.y, aimAt(e), 3.2, "#ffd166"); },
  spread(e) {
    if (e.t % 70 === 0) {
      const a = aimAt(e);
      for (let i = -2; i <= 2; i++) fire(e.x, e.y, a + i * 0.22, 2.6, "#ff6b9a");
    }
  },
  ring(e) {
    if (e.t % 90 === 0) {
      const n = 14, off = Math.random();
      for (let i = 0; i < n; i++) fire(e.x, e.y, (i + off) / n * Math.PI * 2, 2.2, "#7bdff2");
    }
  },
  spiral(e) {
    if (e.t % 6 === 0) {
      const a = e.t * 0.13;
      fire(e.x, e.y, a, 2.4, "#c77dff", 4);
      fire(e.x, e.y, a + Math.PI, 2.4, "#c77dff", 4);
    }
  },
  boss(e) {
    const phase = Math.floor(e.t / 360) % 3;
    if (phase === 0 && e.t % 5 === 0) {
      const a = e.t * 0.09;
      for (let k = 0; k < 4; k++) fire(e.x, e.y, a + k * Math.PI / 2, 2.6, "#c77dff", 4);
    } else if (phase === 1 && e.t % 40 === 0) {
      const n = 24, off = Math.random();
      for (let i = 0; i < n; i++) fire(e.x, e.y, (i + off) / n * Math.PI * 2, 2.0 + (e.t / 40 % 2) * 0.8, "#7bdff2");
    } else if (phase === 2 && e.t % 12 === 0) {
      const a = aimAt(e);
      for (let i = -3; i <= 3; i++) fire(e.x, e.y, a + i * 0.12, 3.4, "#ffd166", 4);
    }
  }
};

// ===== 적 생성 =====
function spawnEnemy(type) {
  const base = { t: 0, flash: 0 };
  if (type === "small") {
    const fromLeft = Math.random() < 0.5;
    enemies.push({ ...base, type, x: rand(40, W - 40), y: -20, vx: fromLeft ? 0.6 : -0.6, vy: 1.6,
      r: 14, hp: 3 + wave, score: 100, pattern: Math.random() < 0.6 ? "aimed" : "spread", color: "#ef476f" });
  } else if (type === "mid") {
    enemies.push({ ...base, type, x: rand(80, W - 80), y: -30, vx: 0, vy: 1.1, stopY: rand(120, 220),
      r: 22, hp: 25 + wave * 5, score: 500, pattern: Math.random() < 0.5 ? "ring" : "spiral", color: "#f78c6b" });
  } else if (type === "boss") {
    bossAlive = true;
    enemies.push({ ...base, type, x: W / 2, y: -60, vx: 0, vy: 1, stopY: 150,
      r: 42, hp: 400 + wave * 120, maxHp: 400 + wave * 120, score: 10000, pattern: "boss", color: "#9b5de5" });
  }
}

function waveDirector() {
  if (bossAlive) return;
  const cycle = frame % 1800; // 30초마다 한 웨이브
  if (cycle === 0) wave++;
  if (cycle < 1500) {
    if (frame % Math.max(25, 60 - wave * 5) === 0) spawnEnemy("small");
    if (cycle % 400 === 200) spawnEnemy("mid");
  } else if (cycle === 1560) {
    spawnEnemy("boss");
  }
}

// ===== 이펙트 / 아이템 =====
function burst(x, y, color, n = 14, speed = 3) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.5, speed);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 40), color });
  }
}
function dropItem(x, y, kind) { items.push({ x, y, vy: -1.5, kind }); }

function useBomb() {
  if (bombs <= 0 || state !== "play") return;
  bombs--;
  for (const b of bullets) burst(b.x, b.y, b.color, 2, 1.5);
  score += bullets.length * 10;
  bullets = [];
  for (const e of enemies) e.hp -= e.type === "boss" ? 60 : 30;
  invuln = Math.max(invuln, 90);
  shake = 20;
}
window.addEventListener("keydown", e => { if (e.code === "KeyX") useBomb(); });
canvas.addEventListener("dblclick", useBomb);

// ===== 업데이트 =====
function update() {
  frame++;
  if (invuln > 0) invuln--;
  if (shake > 0) shake--;

  // 플레이어 이동 (Shift: 저속 정밀 이동)
  const slow = keys.ShiftLeft || keys.ShiftRight;
  const sp = slow ? player.speed * 0.45 : player.speed;
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (dx && dy) { dx *= Math.SQRT1_2; dy *= Math.SQRT1_2; }
  player.x = clamp(player.x + dx * sp, 10, W - 10);
  player.y = clamp(player.y + dy * sp, 10, H - 10);

  // 자동 사격
  if (--player.cooldown <= 0) {
    player.cooldown = 6;
    const p = Math.floor(power);
    shots.push({ x: player.x, y: player.y - 12, vx: 0 });
    if (p >= 2) { shots.push({ x: player.x - 10, y: player.y - 6, vx: -0.6 }); shots.push({ x: player.x + 10, y: player.y - 6, vx: 0.6 }); }
    if (p >= 3) { shots.push({ x: player.x - 16, y: player.y, vx: -1.4 }); shots.push({ x: player.x + 16, y: player.y, vx: 1.4 }); }
  }
  for (const s of shots) { s.y -= 11; s.x += s.vx; }
  shots = shots.filter(s => s.y > -10 && s.x > -10 && s.x < W + 10);

  waveDirector();

  // 적
  for (const e of enemies) {
    e.t++;
    if (e.stopY !== undefined && e.y < e.stopY) e.y += e.vy;
    else if (e.stopY !== undefined) {
      e.x += Math.sin(e.t * 0.02) * (e.type === "boss" ? 1.4 : 0.8);
      if (e.type === "mid" && e.t > 600) e.y += 1.2; // 일정 시간 후 퇴장
    } else { e.x += e.vx; e.y += e.vy; }
    if (e.y > 0) patterns[e.pattern](e);
    if (e.flash > 0) e.flash--;

    for (const s of shots) {
      if (!s.dead && dist2(s, e) < (e.r + 4) ** 2) {
        s.dead = true; e.hp--; e.flash = 3; score += 5;
      }
    }
  }
  shots = shots.filter(s => !s.dead);

  for (const e of enemies) {
    if (e.hp <= 0 && !e.dead) {
      e.dead = true;
      score += e.score;
      burst(e.x, e.y, e.color, e.type === "boss" ? 80 : 20, e.type === "boss" ? 6 : 3);
      if (e.type === "boss") {
        bossAlive = false; shake = 30;
        for (const b of bullets) burst(b.x, b.y, b.color, 1, 1);
        bullets = [];
        dropItem(e.x, e.y, "bomb"); dropItem(e.x - 20, e.y, "power"); dropItem(e.x + 20, e.y, "power");
        frame = Math.ceil(frame / 1800) * 1800 - 1; // 다음 웨이브로
      } else if (e.type === "mid" || Math.random() < 0.12) {
        dropItem(e.x, e.y, Math.random() < 0.85 ? "power" : "bomb");
      }
    }
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 60 && e.x > -60 && e.x < W + 60);

  // 적 탄
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  if (invuln <= 0) {
    for (const b of bullets) {
      if (dist2(b, player) < (b.r + player.r) ** 2) { hitPlayer(); break; }
    }
    for (const e of enemies) {
      if (dist2(e, player) < (e.r * 0.7 + player.r) ** 2) { hitPlayer(); break; }
    }
  }

  // 아이템
  for (const it of items) {
    it.vy = Math.min(it.vy + 0.05, 2);
    const d = Math.sqrt(dist2(it, player));
    if (d < 70 || player.y < 200) { it.x += (player.x - it.x) * 0.15; it.y += (player.y - it.y) * 0.15; }
    else it.y += it.vy;
    if (d < 16) {
      it.dead = true;
      if (it.kind === "power") { power = Math.min(3.99, power + 0.34); score += 50; }
      else bombs = Math.min(5, bombs + 1);
    }
  }
  items = items.filter(it => !it.dead && it.y < H + 20);

  // 파티클
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

function hitPlayer() {
  burst(player.x, player.y, "#ffffff", 40, 5);
  lives--; shake = 25;
  bullets = [];
  power = Math.max(1, power - 1);
  if (lives < 0) {
    state = "over";
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem("game1_high", String(highScore)); } catch (e) {}
    }
    return;
  }
  bombs = Math.max(bombs, 2);
  invuln = 150;
  player.x = W / 2; player.y = H - 80;
}

// ===== 그리기 =====
const stars = Array.from({ length: 80 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(0.3, 1.8) }));

function drawBackground() {
  ctx.fillStyle = "#0b0d17";
  ctx.fillRect(0, 0, W, H);
  for (const st of stars) {
    st.y += st.s;
    if (st.y > H) { st.y = 0; st.x = rand(0, W); }
    ctx.fillStyle = `rgba(200,210,255,${st.s / 2})`;
    ctx.fillRect(st.x, st.y, st.s, st.s * 2);
  }
}

function drawPlayer() {
  if (invuln > 0 && Math.floor(invuln / 4) % 2 === 0) return;
  const { x, y } = player;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = "#4cc9f0";
  ctx.beginPath();
  ctx.moveTo(0, -16); ctx.lineTo(11, 12); ctx.lineTo(0, 6); ctx.lineTo(-11, 12);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(255,170,60,${0.6 + Math.random() * 0.4})`;
  ctx.fillRect(-3, 8, 6, 6 + Math.random() * 6);
  ctx.restore();
  // 저속 모드일 때 피격 판정 표시
  if (keys.ShiftLeft || keys.ShiftRight || pointer) {
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#ff4d6d"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, player.r + 1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = e.flash ? "#ffffff" : e.color;
  if (e.type === "boss") {
    ctx.rotate(e.t * 0.01);
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2, r = i % 2 ? e.r * 0.7 : e.r;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#0b0d17";
    ctx.beginPath(); ctx.arc(0, 0, e.r * 0.35, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === "mid") {
    ctx.beginPath();
    ctx.moveTo(0, e.r); ctx.lineTo(e.r, 0); ctx.lineTo(0, -e.r); ctx.lineTo(-e.r, 0);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(0, e.r); ctx.lineTo(e.r, -e.r * 0.6); ctx.lineTo(-e.r, -e.r * 0.6);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawBossBar() {
  const boss = enemies.find(e => e.type === "boss");
  if (!boss) return;
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(20, 44, W - 40, 6);
  ctx.fillStyle = "#9b5de5";
  ctx.fillRect(20, 44, (W - 40) * Math.max(0, boss.hp / boss.maxHp), 6);
}

function drawHUD() {
  ctx.fillStyle = "#e0e6ff";
  ctx.font = "16px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(`점수 ${score}`, 12, 24);
  ctx.textAlign = "right";
  ctx.fillText(`♥ ${Math.max(0, lives)}   ✹ ${bombs}   P ${Math.floor(power)}`, W - 12, 24);
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(224,230,255,0.5)";
  ctx.fillText(`WAVE ${wave}`, W / 2, 24);
}

function centerText(lines) {
  ctx.fillStyle = "rgba(11,13,23,0.7)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  lines.forEach(([text, size, color], i) => {
    ctx.font = `${size}px system-ui, sans-serif`;
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, H / 2 - 80 + i * 44);
  });
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) / 4, rand(-shake, shake) / 4);
  drawBackground();

  if (state === "title") {
    centerText([
      ["탄막 슈팅", 40, "#4cc9f0"],
      ["이동: 방향키 / WASD  ·  저속: Shift", 15, "#e0e6ff"],
      ["폭탄: X  ·  일시정지: P", 15, "#e0e6ff"],
      ["모바일: 드래그로 이동, 더블탭 폭탄", 15, "#e0e6ff"],
      ["Enter 또는 화면을 눌러 시작", 18, "#ffd166"],
      [`최고 점수 ${highScore}`, 15, "#9aa3c7"],
    ]);
    ctx.restore();
    return;
  }

  for (const it of items) {
    ctx.fillStyle = it.kind === "power" ? "#ef476f" : "#06d6a0";
    ctx.fillRect(it.x - 7, it.y - 7, 14, 14);
    ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(it.kind === "power" ? "P" : "B", it.x, it.y + 4);
  }
  ctx.fillStyle = "#a0f0ff";
  for (const s of shots) ctx.fillRect(s.x - 2, s.y - 8, 4, 14);
  for (const e of enemies) drawEnemy(e);
  drawPlayer();
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
  drawBossBar();
  drawHUD();

  if (state === "pause") centerText([["일시정지", 32, "#e0e6ff"], ["P를 눌러 계속", 16, "#9aa3c7"]]);
  if (state === "over") centerText([
    ["GAME OVER", 40, "#ef476f"],
    [`점수 ${score}`, 22, "#e0e6ff"],
    [`최고 점수 ${highScore}`, 16, "#9aa3c7"],
    ["Enter 또는 화면을 눌러 다시 시작", 16, "#ffd166"],
  ]);
  ctx.restore();
}

// ===== 메인 루프 (60fps 고정 업데이트) =====
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= 1000 / 60) {
    if (state === "play") update();
    acc -= 1000 / 60;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
